[package]
name = "server-project"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.11.1"
once_cell = "1.21.3"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[[bin]]
name = "server-jk"
path = "src/cmd/tcplistener/main.rs"

